# Include inside the ni-os.ru HTTPS server; replaces previous /web locations.
    location = /web { return 308 /web/$is_args$args; }
    location ^~ /web/ {
        root /var/www/nios-flutter/current;
        index index.html;
        try_files $uri $uri/ /web/index.html;
        gzip on;
        gzip_types application/javascript application/wasm application/json text/css image/svg+xml;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        location ~ \.wasm$ { types { application/wasm wasm; } try_files $uri =404; }
        location ~ \.(?:js|json|css|png|svg|woff2?|ttf|bin)$ { try_files $uri =404; }
    }
    location = /old/web { return 308 /old/web/$is_args$args; }
    location ^~ /old/web/ {
        root /var/www/nios-legacy;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /firebase-messaging-sw.js {
        alias /var/www/nios-flutter/current/web/firebase-messaging-sw.js;
        add_header Cache-Control "no-cache" always;
    }

