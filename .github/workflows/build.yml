name: Build Android & Web

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --fatal-infos

      - run: flutter test test/suite_test.dart --timeout 60s

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse_flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Create google-services.json
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "825221435616",
              "project_id": "niosmes",
              "storage_bucket": "niosmes.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:825221435616:android:225ca60a8de4e3ce388085",
                  "android_client_info": {
                    "package_name": "com.niosmess.pulse"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyBKS1OjGKwwJmvEnBwg8q1_WDw1G_def2w"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/niosmess.apk

      - name: Generate Version Metadata & Changelog
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          python3 -c "
          import json, re, os

          version = '$VERSION'.split('+')[0]
          changelog = ''
          changelog_file = '../CHANGELOG.md'
          if os.path.exists(changelog_file):
              with open(changelog_file, 'r', encoding='utf-8') as f:
                  content = f.read()
              m = re.search(r'##\s*\[?' + re.escape(version) + r'\]?[^\n]*\n(.*?)(?=\n##\s*\[|\Z)', content, re.DOTALL)
              if not m:
                  m = re.search(r'##\s*\[.*?\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)', content, re.DOTALL)
              if m:
                  changelog = m.group(1).strip()

          if not changelog:
              changelog = '• Повышение стабильности и производительности\n• Исправление мелких ошибок'

          with open('build/app/outputs/flutter-apk/version.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'version': '$VERSION',
                  'tag_name': 'latest',
                  'changelog': changelog,
                  'download_url': 'https://github.com/SH20FK/NiosMess/releases/download/latest/niosmess.apk',
                  'published_at': os.popen('date -u +\"%Y-%m-%dT%H:%M:%SZ\"').read().strip()
              }, f, ensure_ascii=False, indent=2)

          with open('changelog_release.txt', 'w', encoding='utf-8') as f:
              f.write(changelog)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: pulse_flutter/build/app/outputs/flutter-apk/niosmess.apk

      - name: Publish GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pulse_flutter/build/app/outputs/flutter-apk/niosmess.apk
            pulse_flutter/build/app/outputs/flutter-apk/version.json
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: NiosMess v${{ env.APP_VERSION }}
          body_path: pulse_flutter/changelog_release.txt
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android-debug:
    name: Build Android APK (debug)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse_flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Create google-services.json
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "825221435616",
              "project_id": "niosmes",
              "storage_bucket": "niosmes.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:825221435616:android:225ca60a8de4e3ce388085",
                  "android_client_info": {
                    "package_name": "com.niosmess.pulse"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyBKS1OjGKwwJmvEnBwg8q1_WDw1G_def2w"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - run: flutter build apk --debug --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: pulse_flutter/build/app/outputs/flutter-apk/*.apk

  build-web:
    name: Build Web
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: pulse_flutter/build/web
