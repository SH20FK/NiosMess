name: Build & Release (Android APK & Windows Installer)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Build an additional Android profile APK for DevTools
        type: boolean
        default: false
      preview_apk:
        description: Build Android APK artifacts from this branch without publishing a release
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # PRs run the reusable definition through its own pull_request trigger.
  # Main/tag/manual builds call it here so release dependencies are explicit.
  protocol-sdk:
    name: Protocol SDK gate
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/protocol-sdk.yml
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────────────
  # 1. Test & Static Analysis (Runs on PRs and main pushes)
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install isolated streaming backend fixture
        run: python -m pip install -r ../backend_changes/protocol_v1/requirements-test.txt

      - name: Enable real Flutter and Python HTTP integration
        run: |
          python -c "import os,sys; from pathlib import Path; p=Path(os.environ['GITHUB_ENV']); p.open('a').write('NIOS_PROTOCOL_TEST_PYTHON='+sys.executable+'\nNIOS_PROTOCOL_BACKEND_PATH='+str(Path('../backend_changes/protocol_v1').resolve())+'\n')"

      - name: Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Test Suite
        run: flutter test test/suite_test.dart --timeout 90s

      - name: Test browser layout and real encrypted media playback
        run: flutter test test/web/browser_media_test.dart --platform chrome --timeout 90s

      - name: Test encrypted streaming against the real Python API
        run: flutter test test/services/secret_stream_python_integration_test.dart --timeout 90s

      # Protocol fixtures above exercise production Python 3.10. Release
      # tooling uses hashlib.file_digest and keeps its Python 3.12 runtime.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release metadata tooling
        run: python -m unittest discover -s tool -p 'test_*.py'

      - name: Verify bundled Noto emoji offline
        run: python tool/import_noto_emoji.py --verify

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Build Android APK (Release with Gradle Cache)
  # ──────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    needs: [test, protocol-sdk]
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' ||
       (github.event_name == 'workflow_dispatch' && inputs.preview_apk))
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version_meta.outputs.app_version }}
    defaults:
      run:
        working-directory: pulse_flutter

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      - name: Inject google-services.json
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "825221435616",
              "project_id": "niosmes",
              "storage_bucket": "niosmes.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:825221435616:android:225ca60a8de4e3ce388085",
                  "android_client_info": {
                    "package_name": "com.niosmess.pulse"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyBKS1OjGKwwJmvEnBwg8q1_WDw1G_def2w"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Optimize symbol font axes without removing glyphs
        run: |
          python3 -m pip install --disable-pip-version-check fonttools==4.67.0
          python3 tool/optimize_symbol_fonts.py

      - name: Build Android APKs and App Bundle (Release)
        run: |
          mkdir -p dist/android
          flutter build apk --release --dart-define=NIOSMESS_BUILD_COMMIT=$GITHUB_SHA
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/niosmess.apk
          flutter build apk --release --split-per-abi --dart-define=NIOSMESS_BUILD_COMMIT=$GITHUB_SHA
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$ABI-release.apk" "dist/android/niosmess-$ABI.apk"
          done
          flutter build appbundle --release --dart-define=NIOSMESS_BUILD_COMMIT=$GITHUB_SHA

      - name: Verify actual Android artifact manifests and architectures
        run: python3 tool/verify_android_artifacts.py

      - name: Generate Version Metadata & Changelog
        id: version_meta
        run: python3 tool/release_metadata.py >> "$GITHUB_OUTPUT"

      - name: Build optional profile APK
        if: github.event_name == 'workflow_dispatch' && inputs.profile
        run: |
          flutter build apk --profile --target-platform android-arm64 --dart-define=PERF_TRACE=true --dart-define=NIOSMESS_BUILD_COMMIT=$GITHUB_SHA
          mkdir -p dist/profile
          cp build/app/outputs/flutter-apk/app-profile.apk dist/profile/niosmess-profile.apk
          flutter build apk --profile --target-platform android-arm64 --target integration_test/performance_test.dart --dart-define=NIOSMESS_BUILD_COMMIT=$GITHUB_SHA
          cp build/app/outputs/flutter-apk/app-profile.apk dist/profile/niosmess-performance-benchmark.apk

      - name: Upload Android Profile
        if: github.event_name == 'workflow_dispatch' && inputs.profile
        uses: actions/upload-artifact@v4
        with:
          name: android-profile
          path: pulse_flutter/dist/profile/*.apk
          retention-days: 7

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle-release
          path: pulse_flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: pulse_flutter/dist/android/*.apk
          retention-days: 7

      - name: Upload Release Metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            pulse_flutter/version.json
            pulse_flutter/changelog_release.txt
          retention-days: 7

  android-startup-smoke:
    name: Android release startup gate
    needs: build-android
    if: needs.build-android.result == 'success'
    uses: ./.github/workflows/android-startup-smoke.yml
    permissions:
      contents: read
      actions: read
    with:
      source_run_id: ${{ format('{0}', github.run_id) }}

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Build Windows Installer (.exe via Inno Setup)
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    needs: [test, protocol-sdk]
    if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pulse_flutter

    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      - name: Build Windows Desktop (Release)
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: flutter build windows --release --dart-define=NIOSMESS_BUILD_COMMIT=${{ github.sha }}

      - name: Compile Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          $exeFile = Get-ChildItem -Path build/windows -Recurse -Filter "pulse_flutter.exe" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $exeFile) {
            $exeFile = Get-ChildItem -Path build/windows -Recurse -Filter "pulse_flutter.exe" | Select-Object -First 1
          }
          if (-not $exeFile) {
            throw "pulse_flutter.exe not found under build/windows!"
          }
          $releaseDir = $exeFile.DirectoryName
          Write-Host "Found Release binaries at: $releaseDir"

          $rawVersion = (Get-Content pubspec.yaml | Select-String -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          $cleanVersion = $rawVersion.Split('+')[0]
          Write-Host "Packaging installer for version: $cleanVersion"

          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $isccPath) {
            throw "Inno Setup compiler (ISCC.exe) not found!"
          }

          & $isccPath "/DSourceDir=$releaseDir" "/DMyAppVersion=$cleanVersion" windows/installer/inno_setup.iss

          if (-not (Test-Path "build/installer/niosmess-windows-setup.exe")) {
            throw "Failed to build niosmess-windows-setup.exe!"
          }
          Write-Host "Installer successfully built: build/installer/niosmess-windows-setup.exe"

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-release
          path: pulse_flutter/build/installer/niosmess-windows-setup.exe
          retention-days: 7

  build-web:
    name: Build Web
    needs: [test, protocol-sdk]
    # Preserve PR web compilation while its SDK gate runs in the standalone
    # PR workflow. Main/tag/manual artifacts require this run's SDK success.
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      (needs.protocol-sdk.result == 'success' ||
       (github.event_name == 'pull_request' && needs.protocol-sdk.result == 'skipped'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --dart-define=NIOSMESS_BUILD_COMMIT=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: pulse_flutter/build/web/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Publish GitHub Release (Unified: APK + Windows Installer)
  # ──────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, android-startup-smoke]
    if: >-
      needs.android-startup-smoke.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-release
          path: dist

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-release
          path: dist

      - name: Download Release Metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: dist

      - name: Include installer integrity in published manifest
        run: python3 pulse_flutter/tool/release_metadata.py --windows-dir dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/niosmess-windows-setup.exe
            dist/version.json
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: NiosMess v${{ needs.build-android.outputs.app_version }}
          body_path: dist/changelog_release.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
