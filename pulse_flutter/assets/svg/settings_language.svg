<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="currentColor">
  <!-- Subtle Background Squircle -->
  <rect x="4" y="4" width="40" height="40" rx="14" fill="currentColor" fill-opacity="0.12"/>

  <!-- Globe Outer Boundary -->
  <circle cx="24" cy="24" r="16.5" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="2"/>

  <!-- Equator Line -->
  <line x1="7.5" y1="24" x2="40.5" y2="24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Meridian Ellipse -->
  <ellipse cx="24" cy="24" rx="8.5" ry="16.5" fill="none" stroke="currentColor" stroke-width="1.8"/>

  <!-- Longitude Center Line -->
  <line x1="24" y1="7.5" x2="24" y2="40.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Latitude Arcs -->
  <path d="M11 15.5 C16 19 32 19 37 15.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M11 32.5 C16 29 32 29 37 32.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
</svg>
