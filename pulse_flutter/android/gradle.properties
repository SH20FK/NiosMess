org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.incremental=true
kotlin.compiler.execution.strategy=out-of-process
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=false
# Flutter's migrator pins the legacy Kotlin handling; several Flutter plugins
# in this app still apply the Kotlin Gradle Plugin themselves.
android.builtInKotlin=false
# The Flutter Gradle Plugin adds a 1000 * ABI offset to split-per-abi version
# codes. This app pins every ABI APK to pubspec's versionCode instead (the
# release verification step asserts a single version code across all APKs).
force-version-code-ignoring-abi=true
