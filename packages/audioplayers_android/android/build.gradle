group 'xyz.luan.audioplayers'
version '1.0-SNAPSHOT'

// Vendored copy of audioplayers_android 5.3.0 (see README-vendor.md).
// Upstream 5.3.0 applies `de.mannodermaus.android-junit5` only to run its own
// unit tests, and that plugin casts the Android extension to `BaseExtension`,
// which does not exist under AGP 9's new DSL. The plugin also pulls AGP 7.3.1
// onto this module's buildscript classpath. Both are removed here; the Kotlin
// sources, manifest and package metadata are unchanged from the published
// 5.3.0 release.

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'xyz.luan.audioplayers'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        disable 'InvalidPackage'
    }
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
}

repositories {
    mavenCentral()
}
